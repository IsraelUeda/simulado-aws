<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS Practice Exam</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- TELA INICIAL -->
        <section id="start-screen" class="screen">

            <div class="logo">
                AWS
            </div>

            <h1>AWS Practice Exam</h1>

            <p class="subtitle">
                Pratique seus conhecimentos sobre AWS através de questionários.
            </p>

            <div class="exam-info">

                <div class="info-card">
                    <span id="total-questions">50</span>
                    <small>Questões disponíveis</small>
                </div>

                <div class="info-card">
                    <span>50</span>
                    <small>Questões no exame</small>
                </div>

            </div>

            <div class="settings">

                <label for="question-count">
                    Quantidade de questões
                </label>

                <select id="question-count">
                    <option value="10">10 questões</option>
                    <option value="20">20 questões</option>
                    <option value="30">30 questões</option>
                    <option value="50">50 questões</option>
                </select>

            </div>

            <button id="start-button" class="primary-button">
                Iniciar simulado
            </button>

        </section>


        <!-- TELA DO QUESTIONÁRIO -->
        <section id="quiz-screen" class="screen hidden">

            <div class="quiz-header">

                <div>
                    <span id="question-counter">
                        Questão 1 de 10
                    </span>
                </div>

                <div>
                    <span id="score">
                        Pontos: 0
                    </span>
                </div>

            </div>

            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>


            <div class="question-card">

                <div class="question-number">
                    Questão <span id="question-number">1</span>
                </div>

                <h2 id="question-text">
                    Carregando questão...
                </h2>

                <div id="options-container"></div>

            </div>


            <div class="quiz-actions">

                <button id="next-button" class="primary-button">
                    Próxima questão
                </button>

            </div>

        </section>


        <!-- TELA DE RESULTADO -->
        <section id="result-screen" class="screen hidden">

            <div class="result-icon">
                ✓
            </div>

            <h1>Simulado finalizado!</h1>

            <p class="subtitle">
                Confira seu desempenho.
            </p>

            <div class="result-card">

                <div class="result-score">
                    <span id="final-score">0%</span>
                    <small>de aproveitamento</small>
                </div>

                <div class="result-stats">

                    <div>
                        <strong id="correct-answers">0</strong>
                        <span>Acertos</span>
                    </div>

                    <div>
                        <strong id="wrong-answers">0</strong>
                        <span>Erros</span>
                    </div>

                    <div>
                        <strong id="total-answered">0</strong>
                        <span>Total</span>
                    </div>

                </div>

            </div>

            <button id="restart-button" class="primary-button">
                Fazer novo simulado
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
